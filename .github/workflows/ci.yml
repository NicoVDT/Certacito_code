name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: certacito
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: certacito_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # the rate limiter falls back to in-memory when redis is missing, so
      # without this the redis path is never actually run in CI
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx
      # the integration tests skip themselves unless the api is actually up,
      # which in CI meant 27 of the tests - every RBAC one included - were
      # quietly not running and the badge was green off the unit tests alone
      - name: Start API
        env:
          DATABASE_URL: postgresql+asyncpg://certacito:testpass@localhost:5432/certacito_test
          SECRET_KEY: test-secret-key-for-ci
          AGENT_API_KEY: test-agent-key-for-ci
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/health || { echo "api never came up"; exit 1; }
          # first account bootstraps as admin, which is what the tests log in as
          curl -sf -X POST http://localhost:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@certacito.ai","password":"test123","role":"Administrator"}' \
            >/dev/null || echo "admin already present"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://certacito:testpass@localhost:5432/certacito_test
          SECRET_KEY: test-secret-key-for-ci
          AGENT_API_KEY: test-agent-key-for-ci
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend && python -m pytest ../tests/backend/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      # vite build only strips the types, it never checks them - we shipped a
      # component referencing a variable that wasnt in scope and the build was
      # still green, so typecheck before building
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npx vite build
