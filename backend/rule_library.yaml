# Advanced Policy Rule Library
# Pre-built governance rules for regulated industry scenarios
# Each rule documents its regulatory alignment

rules:
  # --- Healthcare (Privacy Act 1988 + My Health Records Act 2012) ---
  - id: "LIB-HEALTH-001"
    name: "Patient record access requires session scope"
    action_type: "data_access"
    risk_threshold: "Critical"
    default_outcome: "DENY"
    conditions: "target CONTAINS patient AND session_scope != target_dataset"
    reg_tag: "Privacy Act 1988 s13G"
    category: "healthcare"
    description: "Blocks any agent from accessing patient records outside its assigned session scope. Aligns with APP 6 (use or disclosure of personal information) and My Health Records Act 2012 s59."
    active: true
    version: 1

  - id: "LIB-HEALTH-002"
    name: "Medicare number access requires explicit authorisation"
    action_type: "data_access"
    risk_threshold: "Critical"
    default_outcome: "ESCALATE"
    conditions: "payload CONTAINS medicare"
    reg_tag: "My Health Records Act 2012 s59"
    category: "healthcare"
    description: "Any access to Medicare identifiers triggers human approval. Medicare numbers are a protected identifier under the Healthcare Identifiers Act 2010."
    active: true
    version: 1

  # --- Financial (APRA CPS 234 + ASD Essential 8) ---
  - id: "LIB-FIN-001"
    name: "Block bulk financial data export"
    action_type: "data_access"
    risk_threshold: "High"
    default_outcome: "DENY"
    conditions: "record_count > 100 AND dataset_type == financial"
    reg_tag: "APRA CPS 234"
    category: "financial"
    description: "Prevents agents from bulk-exporting financial records. APRA CPS 234 requires information assets to be classified and protected commensurate with their sensitivity and criticality."
    active: true
    version: 1

  - id: "LIB-FIN-002"
    name: "External transfer requires dual approval"
    action_type: "external_call"
    risk_threshold: "Critical"
    default_outcome: "ESCALATE"
    conditions: "action CONTAINS transfer AND amount > 10000"
    reg_tag: "APRA CPS 234 + AUSTRAC"
    category: "financial"
    description: "Any agent-initiated financial transfer over $10,000 requires human approval. Aligns with AUSTRAC reporting obligations and APRA operational risk management."
    active: true
    version: 1

  # --- Information Security (ISO 27001 + NIST) ---
  - id: "LIB-SEC-001"
    name: "Block credential harvesting patterns"
    action_type: "credential_access"
    risk_threshold: "Critical"
    default_outcome: "DENY"
    conditions: "access_type == read AND credential_scope == production"
    reg_tag: "ISO 27001 A.9.4"
    category: "infosec"
    description: "Blocks agents from reading production credentials. ISO 27001 A.9.4 requires access control to be enforced at system and application level. Production secrets must never be exposed to agent runtime."
    active: true
    version: 1

  - id: "LIB-SEC-002"
    name: "Rate-limit API calls per agent per minute"
    action_type: "external_call"
    risk_threshold: "Medium"
    default_outcome: "DENY"
    conditions: "agent_calls_per_minute > 60"
    reg_tag: "NIST CSF PR.AC-4"
    category: "infosec"
    description: "Prevents agents from making excessive external API calls. NIST CSF PR.AC-4 requires access permissions to be managed incorporating principles of least privilege and separation of duties."
    active: true
    version: 1

  # --- AI Safety (OWASP LLM Top 10 + AU Guardrails) ---
  - id: "LIB-AI-001"
    name: "Block prompt injection in tool payloads"
    action_type: "prompt_content"
    risk_threshold: "Critical"
    default_outcome: "DENY"
    conditions: "input MATCHES injection_patterns"
    reg_tag: "OWASP LLM01"
    category: "ai_safety"
    description: "Detects and blocks prompt injection attempts including instruction override, role-play jailbreaks, and system prompt leakage. Aligns with OWASP LLM01 (Prompt Injection)."
    active: true
    version: 1

  - id: "LIB-AI-002"
    name: "Block sensitive data in LLM responses"
    action_type: "prompt_content"
    risk_threshold: "High"
    default_outcome: "DENY"
    conditions: "output CONTAINS PII_patterns"
    reg_tag: "OWASP LLM06 + AU Guardrail 7"
    category: "ai_safety"
    description: "Prevents LLM responses from containing unmasked PII. Aligns with OWASP LLM06 (Sensitive Information Disclosure) and Australian Government AI Guardrail 7 (Privacy protection and security)."
    active: true
    version: 1

  - id: "LIB-AI-003"
    name: "Require human approval for autonomous actions"
    action_type: "*"
    risk_threshold: "High"
    default_outcome: "ESCALATE"
    conditions: "agent_autonomy_level == high AND risk_score > 50"
    reg_tag: "AU Guardrail 3 + AU Guardrail 6"
    category: "ai_safety"
    description: "Ensures high-autonomy agents cannot take high-risk actions without human review. Aligns with AU Guardrail 3 (Human oversight) and Guardrail 6 (Transparency and explainability)."
    active: true
    version: 1

  # --- General Compliance (SOC 2) ---
  - id: "LIB-SOC-001"
    name: "Audit all write operations"
    action_type: "file_write"
    risk_threshold: "Low"
    default_outcome: "PERMIT"
    conditions: "always_true"
    reg_tag: "SOC 2 CC6.1"
    category: "compliance"
    description: "Permits file writes but ensures every write operation is logged to the audit trail. SOC 2 CC6.1 requires logical and physical access controls to protect information assets."
    active: true
    version: 1
